version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
